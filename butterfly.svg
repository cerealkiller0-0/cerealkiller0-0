<style>
text{font-family:'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,'Courier New',monospace;font-size:13px;fill:url(#g);white-space:pre}
.fly{transform-origin:450.0px 326px;animation:drift 7s ease-in-out infinite}
.wl{transform-origin:430.5px 326px;animation:flap 2.8s cubic-bezier(.45,.05,.55,.95) infinite}
.wr{transform-origin:469.5px 326px;animation:flap 2.8s cubic-bezier(.45,.05,.55,.95) infinite}
.sp{fill:#ff9ccb;opacity:0;animation:rise 6s ease-in infinite}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.32)}}
@keyframes drift{0%,100%{transform:translate(-8px,8px) rotate(-2.5deg)}25%{transform:translate(10px,-8px) rotate(2deg)}50%{transform:translate(0,-18px) rotate(2.5deg)}75%{transform:translate(-12px,-5px) rotate(-2deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-110px)}}
@media (prefers-reduced-motion:reduce){.fly,.wl,.wr,.sp{animation:none}}
</style>

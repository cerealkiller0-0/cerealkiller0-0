<title>Pink ASCII butterfly</title>
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="619"><stop offset="0" stop-color="#ffe3f0"/><stop offset=".35" stop-color="#ff9ccb"/><stop offset=".7" stop-color="#ff5fa8"/><stop offset="1" stop-color="#d9488f"/></linearGradient>
<radialGradient id="bg" cx=".5" cy=".46" r=".75"><stop offset="0" stop-color="#3a1030"/><stop offset=".5" stop-color="#1c0818"/><stop offset="1" stop-color="#0a0309"/></radialGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

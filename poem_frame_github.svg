<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <!-- Transparent background -->
  
  <!-- Main frame -->
  <rect x="60" y="30" width="1080" height="240" rx="8" ry="8" 
        fill="none" stroke="#ffffff" stroke-width="2.2"/>

  <!-- TOP-LEFT: leaves curling from corner along top edge + tulip bud -->
  <path d="M68,30 C60,20 50,22 48,12" stroke="#5a8a4a" stroke-width="1.5" fill="none"/>
  <path d="M68,30 C58,22 54,24 48,12 C56,18 62,16 68,30" fill="#7ab86a" opacity="0.75"/>
  <path d="M78,30 C82,18 92,16 100,22" stroke="#5a8a4a" stroke-width="1.3" fill="none"/>
  <path d="M78,30 C82,14 94,12 100,22 C90,20 84,22 78,30" fill="#7ab86a" opacity="0.7"/>
  <path d="M105,28 C110,16 120,14 128,20" stroke="#5a8a4a" stroke-width="1.3" fill="none"/>
  <path d="M105,28 C110,12 122,10 128,20 C118,18 112,20 105,28" fill="#7ab86a" opacity="0.65"/>
  <g transform="translate(140, 24)">
    <line x1="0" y1="4" x2="0" y2="10" stroke="#5a8a4a" stroke-width="1.3"/>
    <ellipse cx="-2.5" cy="0" rx="2.8" ry="4.5" fill="#e8a0b0" transform="rotate(-8)"/>
    <ellipse cx="2.5" cy="0" rx="2.8" ry="4.5" fill="#d48a9a" transform="rotate(8)"/>
    <ellipse cx="0" cy="-1" rx="2.2" ry="5" fill="#edb0c0"/>
  </g>

  <!-- TOP-RIGHT: tulip drooping from top border -->
  <g transform="translate(1110, 30)">
    <line x1="0" y1="0" x2="8" y2="22" stroke="#5a8a4a" stroke-width="1.5"/>
    <path d="M4,10 C14,8 18,14 16,22" stroke="#5a8a4a" stroke-width="1" fill="none"/>
    <path d="M4,10 C16,6 20,14 16,22 C14,14 10,12 4,10" fill="#7ab86a" opacity="0.7"/>
    <g transform="translate(9, 24) rotate(20)">
      <ellipse cx="-2.5" cy="0" rx="3" ry="5" fill="#e8a0b0" transform="rotate(-10)"/>
      <ellipse cx="2.5" cy="0" rx="3" ry="5" fill="#d48a9a" transform="rotate(10)"/>
      <ellipse cx="0" cy="-1" rx="2.5" ry="5.5" fill="#edb0c0"/>
    </g>
  </g>

  <!-- BOTTOM-LEFT: tulip pointing up from bottom border -->
  <g transform="translate(90, 270)">
    <line x1="0" y1="0" x2="-8" y2="-22" stroke="#5a8a4a" stroke-width="1.5"/>
    <path d="M-4,-10 C-14,-8 -18,-14 -16,-22" stroke="#5a8a4a" stroke-width="1" fill="none"/>
    <path d="M-4,-10 C-16,-6 -20,-14 -16,-22 C-14,-14 -10,-12 -4,-10" fill="#7ab86a" opacity="0.7"/>
    <g transform="translate(-9, -24) rotate(-20)">
      <ellipse cx="-2.5" cy="0" rx="3" ry="5" fill="#e8a0b0" transform="rotate(-10)"/>
      <ellipse cx="2.5" cy="0" rx="3" ry="5" fill="#d48a9a" transform="rotate(10)"/>
      <ellipse cx="0" cy="1" rx="2.5" ry="5.5" fill="#edb0c0"/>
    </g>
  </g>

  <!-- BOTTOM-RIGHT: leaves curling from corner + tulip bud -->
  <path d="M1132,270 C1140,280 1150,278 1152,288" stroke="#5a8a4a" stroke-width="1.5" fill="none"/>
  <path d="M1132,270 C1142,278 1146,276 1152,288 C1144,282 1138,284 1132,270" fill="#7ab86a" opacity="0.75"/>
  <path d="M1122,270 C1118,282 1108,284 1100,278" stroke="#5a8a4a" stroke-width="1.3" fill="none"/>
  <path d="M1122,270 C1118,286 1106,288 1100,278 C1110,280 1116,278 1122,270" fill="#7ab86a" opacity="0.7"/>
  <path d="M1095,272 C1090,284 1080,286 1072,280" stroke="#5a8a4a" stroke-width="1.3" fill="none"/>
  <path d="M1095,272 C1090,288 1078,290 1072,280 C1082,282 1088,280 1095,272" fill="#7ab86a" opacity="0.65"/>
  <g transform="translate(1060, 276) rotate(180)">
    <line x1="0" y1="4" x2="0" y2="10" stroke="#5a8a4a" stroke-width="1.3"/>
    <ellipse cx="-2.5" cy="0" rx="2.8" ry="4.5" fill="#e8a0b0" transform="rotate(-8)"/>
    <ellipse cx="2.5" cy="0" rx="2.8" ry="4.5" fill="#d48a9a" transform="rotate(8)"/>
    <ellipse cx="0" cy="-1" rx="2.2" ry="5" fill="#edb0c0"/>
  </g>

  <!-- POEM TEXT -->
  <text x="110" y="85" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" 
        font-size="28" fill="#ffffff" font-style="italic">
    "A day will come when men will discover an alphabet in
  </text>
  <text x="110" y="133" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" 
        font-size="28" fill="#ffffff" font-style="italic">
    the eyes of chalcedonies, in the markings of the moth,
  </text>
  <text x="110" y="181" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" 
        font-size="28" fill="#ffffff" font-style="italic">
    and will learn in astonishment that every spotted snail
  </text>
  <text x="110" y="229" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" 
        font-size="28" fill="#ffffff" font-style="italic">
    has always been a poem."
  </text>
  
  <!-- Author - bigger font -->
  <text x="1090" y="260" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" 
        font-size="22" fill="#ffffff" font-style="italic" text-anchor="end">
    From Alejo Carpentier's The Lost Steps
  </text>
</svg>
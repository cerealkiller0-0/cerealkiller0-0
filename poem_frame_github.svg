<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <!-- Transparent background -->
  
  <!-- Main rectangular frame -->
  <rect x="40" y="20" width="1120" height="260" rx="4" ry="4" 
        fill="none" stroke="#ffffff" stroke-width="2.5"/>
  
  <!-- Inner decorative line -->
  <rect x="46" y="26" width="1108" height="248" rx="3" ry="3" 
        fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.8"/>
  
  <!-- TOP LEFT TULIPS -->
  <g transform="translate(48, 12) rotate(-20)">
    <line x1="0" y1="2" x2="0" y2="20" stroke="#5a8a4a" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-2" rx="4" ry="6" fill="#e8a0b0" transform="rotate(-15)"/>
    <ellipse cx="4" cy="-2" rx="4" ry="6" fill="#d48a9a" transform="rotate(15)"/>
    <ellipse cx="0" cy="-3" rx="3.5" ry="6.5" fill="#edb0c0"/>
  </g>
  <g transform="translate(68, 8) rotate(-5)">
    <line x1="0" y1="2" x2="0" y2="22" stroke="#5a8a4a" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-2" rx="4" ry="6" fill="#d48a9a" transform="rotate(-10)"/>
    <ellipse cx="4" cy="-2" rx="4" ry="6" fill="#e8a0b0" transform="rotate(10)"/>
    <ellipse cx="0" cy="-3" rx="3.5" ry="6.5" fill="#edb0c0"/>
  </g>
  <g transform="translate(82, 22)">
    <path d="M0,2 Q30,-14 70,-6" stroke="#5a8a4a" stroke-width="1.8" fill="none"/>
    <path d="M0,2 Q30,-20 70,-6 Q30,-2 0,2" fill="#7ab86a" opacity="0.75"/>
  </g>
  <g transform="translate(145, 14) rotate(35)">
    <ellipse cx="0" cy="0" rx="3.5" ry="5.5" fill="#e8a0b0" opacity="0.55"/>
  </g>

  <!-- TOP RIGHT TULIPS -->
  <g transform="translate(1132, 12) rotate(15)">
    <line x1="0" y1="2" x2="0" y2="20" stroke="#5a8a4a" stroke-width="1.8"/>
    <ellipse cx="-4" cy="-2" rx="4" ry="6" fill="#e8a0b0" transform="rotate(-15)"/>
    <ellipse cx="4" cy="-2" rx="4" ry="6" fill="#d48a9a" transform="rotate(15)"/>
    <ellipse cx="0" cy="-3" rx="3.5" ry="6.5" fill="#edb0c0"/>
  </g>
  <g transform="translate(1152, 8) rotate(25)">
    <line x1="0" y1="2" x2="0" y2="18" stroke="#5a8a4a" stroke-width="1.8"/>
    <ellipse cx="-3.5" cy="-2" rx="3.5" ry="5.5" fill="#d48a9a" transform="rotate(-10)"/>
    <ellipse cx="3.5" cy="-2" rx="3.5" ry="5.5" fill="#e8a0b0" transform="rotate(10)"/>
    <ellipse cx="0" cy="-3" rx="3" ry="6" fill="#edb0c0"/>
  </g>
  <g transform="translate(1118, 22) scale(-1,1)">
    <path d="M0,2 Q30,-14 70,-6" stroke="#5a8a4a" stroke-width="1.8" fill="none"/>
    <path d="M0,2 Q30,-20 70,-6 Q30,-2 0,2" fill="#7ab86a" opacity="0.75"/>
  </g>
  <g transform="translate(1055, 14) rotate(-30)">
    <ellipse cx="0" cy="0" rx="3.5" ry="5.5" fill="#e8a0b0" opacity="0.55"/>
  </g>

  <!-- BOTTOM LEFT TULIP -->
  <g transform="translate(55, 280) rotate(165)">
    <line x1="0" y1="2" x2="0" y2="16" stroke="#5a8a4a" stroke-width="1.5"/>
    <ellipse cx="-3" cy="-1.5" rx="3.5" ry="4.5" fill="#e8a0b0" transform="rotate(-10)"/>
    <ellipse cx="3" cy="-1.5" rx="3.5" ry="4.5" fill="#d48a9a" transform="rotate(10)"/>
    <ellipse cx="0" cy="-2.5" rx="3" ry="5" fill="#edb0c0"/>
  </g>
  <g transform="translate(66, 278)">
    <path d="M0,0 Q15,8 32,4" stroke="#5a8a4a" stroke-width="1.3" fill="none"/>
    <path d="M0,0 Q15,12 32,4 Q15,-1 0,0" fill="#7ab86a" opacity="0.6"/>
  </g>

  <!-- BOTTOM RIGHT TULIP -->
  <g transform="translate(1145, 282) rotate(195)">
    <line x1="0" y1="2" x2="0" y2="16" stroke="#5a8a4a" stroke-width="1.5"/>
    <ellipse cx="-3" cy="-1.5" rx="3.5" ry="4.5" fill="#e8a0b0" transform="rotate(-10)"/>
    <ellipse cx="3" cy="-1.5" rx="3.5" ry="4.5" fill="#d48a9a" transform="rotate(10)"/>
    <ellipse cx="0" cy="-2.5" rx="3" ry="5" fill="#edb0c0"/>
  </g>
  <g transform="translate(1134, 280) scale(-1,1)">
    <path d="M0,0 Q15,8 32,4" stroke="#5a8a4a" stroke-width="1.3" fill="none"/>
    <path d="M0,0 Q15,12 32,4 Q15,-1 0,0" fill="#7ab86a" opacity="0.6"/>
  </g>

  <!-- POEM TEXT - Larger font, justified, last line right-aligned -->
  <text x="90" y="80" 
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif" 
        font-size="28" fill="#ffffff" font-style="italic">
    "A day will come when men will discover an alphabet in
  </text>
  
  <text x="90" y="128" 
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif" 
        font-size="28" fill="#ffffff" font-style="italic">
    the eyes of chalcedonies, in the markings of the moth,
  </text>
  
  <text x="90" y="176" 
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif" 
        font-size="28" fill="#ffffff" font-style="italic">
    and will learn in astonishment that every spotted snail
  </text>
  
  <!-- Last line - left aligned -->
  <text x="90" y="224" 
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif" 
        font-size="28" fill="#ffffff" font-style="italic">
    has always been a poem."
  </text>
  
  <!-- Author - bottom right -->
  <text x="1110" y="260" 
        font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif" 
        font-size="19" fill="#ffffff" font-style="italic"
        text-anchor="end">
    — Alejo Carpentier, The Lost Steps
  </text>
</svg>